version: '3.8'

services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    env_file:
      - .env
    command: ["http", "--url=${NGROK_DOMAIN}", "host.docker.internal:8080"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
