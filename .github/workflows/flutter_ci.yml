name: Flutter CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/flutter_ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/flutter_ci.yml'
  workflow_dispatch:

# Cancel any in-progress run on the same branch to save CI minutes
concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter (stable, pinned)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.38.5'
          cache: true

      - name: Create dummy .env for build
        run: echo "BACKEND_URL=http://localhost:8080" > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code (zero warnings policy)
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
