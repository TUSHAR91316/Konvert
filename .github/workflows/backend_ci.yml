name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend_ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend_ci.yml'
  workflow_dispatch:

# Cancel any in-progress run on the same branch to save CI minutes
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, Build & Smoke Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8 (syntax errors & critical issues)
        run: |
          # Fail on syntax errors, undefined names, unused imports
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warn on style issues (max line length 127)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Build Docker image
        run: |
          # Create a dummy .env so docker-compose doesn't fail on missing file
          echo "NGROK_AUTHTOKEN=dummy" > .env
          echo "NGROK_DOMAIN=dummy.ngrok-free.app" >> .env
          docker build -t backend-test .

      - name: Start container and run health smoke test
        run: |
          docker run -d --name backend-smoke -p 8080:8080 backend-test
          echo "Waiting for server to start..."
          sleep 8
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health)
          echo "Health endpoint returned: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "SMOKE TEST FAILED: Expected 200, got $STATUS"
            docker logs backend-smoke
            exit 1
          fi
          echo "SMOKE TEST PASSED"
          docker stop backend-smoke
          docker rm backend-smoke
